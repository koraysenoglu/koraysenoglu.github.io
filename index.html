
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Popstak: Block Puzzle - A strategic puzzle game for iOS.">
  <title>Popstak: Block Puzzle</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #10121b;
      color: #f5f5f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .accent { color: #8b8dff; }
    h1 { font-size: 22px; font-weight: 500; }
    p {
      max-width: 440px;
      line-height: 1.7;
      color: #a9acbc;
      font-size: 16px;
    }
    .button {
      display: inline-block;
      background: #f5f5f8;
      color: #10121b;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 24px;
    }
    .button:hover { background: #dcdcff; }
    footer {
      margin-top: 80px;
      color: #777b8f;
      font-size: 13px;
    }
    footer a { color: #aaaee8; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">POP<span class="accent">STAK</span></div>
    <h1>Block Puzzle</h1>
    <p>
      A strategic block puzzle where every move matters.
      Pop colorful groups, manage Risk, clear Blockers,
      and challenge yourself to beat your high score.
    </p>
    <a class="button"
       href="https://apps.apple.com/app/id6820714788">
       Download on the App Store
    </a>
  </main>
  <footer>
    <p>Developed by Koray Senoglu</p>
    <a href="https://koraysenoglu.github.io/popstak-privacy/support/">
      Support
    </a>
    <p>&copy; 2026 Koray Senoglu. All rights reserved.</p>
  </footer>
</body>
</html>
